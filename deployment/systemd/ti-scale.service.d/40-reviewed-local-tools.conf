[Service]
# Bubblewrap uses one AF_NETLINK route socket while constructing the isolated
# target-free probe network namespace. The service and child tools still have
# an empty capability set; the probe has no host network interface, and real
# Guided dispatch remains constrained to AF_INET/AF_INET6 by exact policy.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
