[Service]
# PID 1 exposes the root-owned OpenRouter key only through this service's
# private, read-only credential directory. No bearer value enters an
# environment variable, command-line argument, repository, or browser state.
LoadCredential=openrouter-api-key:/etc/ti-scale/openrouter-api-key
Environment=TI_SCALE_OPENROUTER_GUIDED_ENABLED=true
Environment=TI_SCALE_OPENROUTER_CREDENTIAL_PATH=%d/openrouter-api-key
# This exact provider/model identifier is bound into every readiness and
# provider-request configuration hash. Change it only through reviewed release
# configuration and rerun provider validation.
Environment=TI_SCALE_OPENROUTER_MODEL=openai/gpt-5.2
