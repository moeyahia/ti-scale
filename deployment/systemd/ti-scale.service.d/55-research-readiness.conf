[Service]
# PID 1 exposes the signing key only through this service's private,
# read-only credential directory. The identifier-only form is deliberately
# optional: an absent credential keeps Ti-Scale available with Research
# blocked instead of preventing the whole service from starting. Install the
# key in the system credential store as `research-integrity-key`.
LoadCredential=research-integrity-key

# The optional environment file supplies the complete hash-pinned descriptor
# configuration as one reviewed unit. Missing configuration leaves Research
# unavailable without weakening or interrupting the rest of Ti-Scale.
EnvironmentFile=-/etc/ti-scale/research-readiness.env
RuntimeDirectory=ti-scale/research-readiness
RuntimeDirectoryMode=0700
