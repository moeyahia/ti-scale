[Unit]
RequiresMountsFor=/var/lib/ti-scale/release-transactions

[Service]
# Root-only boot/start gate. A nonterminal release journal blocks ordinary
# systemd restart; only the lock-holding release reconciler can issue one
# exact, short-lived authorization for its prepared service_start boundary.
ExecStartPre=+/usr/local/bin/bun run /usr/local/libexec/ti-scale-release-start-admission.js
# The service itself always enters through a root-owned, reviewed wrapper.
# The wrapper runs as the service account (no '+' prefix), fences all normal
# HTTP and application startup during source recovery, then replaces itself
# with the selected application after the durable recovery commitment opens.
ExecStart=
ExecStart=/usr/local/bin/bun run /usr/local/libexec/ti-scale-service-wrapper.js
