[Service]
# Reviewed local-tool source of truth. Copy the four JSON documents from
# deployment/runtime-config/ into /etc/ti-scale/runtime with root ownership,
# directory mode 0700, and file mode 0600 before enabling this drop-in.
Environment=TI_SCALE_LOCAL_TOOL_TRUSTED_CONFIG_ROOT=/etc/ti-scale/runtime
Environment=TI_SCALE_LOCAL_TOOL_CAPABILITY_MANIFEST_PATH=/etc/ti-scale/runtime/local-tool-capabilities.v1.json
Environment=TI_SCALE_LOCAL_TOOL_CAPABILITY_MANIFEST_SHA256=e01573cd95ae9046bc17b33e809f38efa949d434199bbb5ed4cad7b67ca93238
Environment=TI_SCALE_LOCAL_TOOL_PROBE_SANDBOX_PATH=/etc/ti-scale/runtime/bubblewrap-probe-sandbox.v1.json
Environment=TI_SCALE_LOCAL_TOOL_PROBE_SANDBOX_SHA256=c715dd5706e91a416367eeac5512fba3c2a145a49fb8fc0778c9e8f2d8d457b9
Environment=TI_SCALE_LOCAL_TOOL_WORKSPACE_MAPPINGS_PATH=/etc/ti-scale/runtime/engagement-workspace-mappings.v1.json
Environment=TI_SCALE_LOCAL_TOOL_WORKSPACE_MAPPINGS_SHA256=0ddf4173205c8d6d7a98dcfabd029a0d1baada653444b689c18853d509a688d1

# The combined configuration names reviewed `host`, `ping`, and bounded
# TCP-connect Nmap direct-argv adapters. This base drop-in deliberately retains
# the disabled Nmap manifest, so the combined runtime remains fail-closed until
# the separately checksum-pinned 60-reviewed-nmap-activation bundle atomically
# overrides every related path and digest. No MCP endpoint, credential, shell,
# or public-provider execution route is configured here.
Environment=TI_SCALE_AUTONOMOUS_DNS_TRUSTED_CONFIG_ROOT=/etc/ti-scale/runtime
Environment=TI_SCALE_AUTONOMOUS_DNS_RUNTIME_CONFIG_PATH=/etc/ti-scale/runtime/autonomous-dns-local-runtime.v1.json
Environment=TI_SCALE_AUTONOMOUS_DNS_RUNTIME_CONFIG_SHA256=12770b66e7d46f8a9043439af3194ed4c478812fa0ffbdd6f6402719fc5116b7
