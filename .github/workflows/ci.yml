name: Standalone verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ti-scale-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, contracts, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      TI_SCALE_CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use the repository Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Bind verification to the checked-out candidate
        run: |
          test "$(git rev-parse HEAD)" = "$TI_SCALE_CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate workflow policy
        run: bun run scripts/validate-ci-workflows.ts

      - name: Validate the complete test inventory and modifier policy
        run: bun run test:policy

      - name: Verify standalone source isolation
        run: bun run isolation:verify

      - name: Type-check application and server
        run: bun run typecheck

      - name: Type-check browser contracts
        run: bun run typecheck:e2e

      - name: Run unit and module tests
        run: sudo -H env "PATH=$PATH" CI=true bun run test

      - name: Validate the interaction manifest
        run: bun run test:interaction-manifest

      - name: Build the production application
        run: bun run build

      - name: Enforce bundle performance budgets
        run: bun run scripts/measure-bundle-performance.ts

      - name: Verify the checked source remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$TI_SCALE_CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Remove transient runner output
        if: always()
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/playwright-report" \
            "$GITHUB_WORKSPACE/test-results" \
            "${RUNNER_TEMP:?}/ti-scale-e2e-data" \
            /tmp/ti-scale-e2e-data
